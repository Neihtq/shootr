[project]
name = "shootr-engine"
version = "0.1.0"
description = "Shootr photo culling engine — scoring, grouping, culling, storage"
requires-python = ">=3.14"
dependencies = ["blake3"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shootr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
